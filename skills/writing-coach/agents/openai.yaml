interface:
  display_name: "Grow as a writer"
  short_description: "Practise a writing technique while keeping your voice"
  default_prompt: "Use $writing-coach to practise one book-writing technique with a small example in my own voice."

dependencies:
  tools:
    - type: "mcp"
      value: "meminto-stories"
      description: "Read and edit the connected user's Meminto books"
      transport: "streamable_http"
      url: "https://app.meminto.com/mcp/v1/mcp.php"
