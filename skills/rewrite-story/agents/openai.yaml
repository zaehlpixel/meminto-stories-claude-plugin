interface:
  display_name: "Revise a passage"
  short_description: "Preview faithful edits to any Meminto book passage"
  default_prompt: "Use $rewrite-story to make this book passage clearer while keeping my facts and voice. Preview before saving."

dependencies:
  tools:
    - type: "mcp"
      value: "meminto-stories"
      description: "Read and edit the connected user's Meminto books"
      transport: "streamable_http"
      url: "https://app.meminto.com/mcp/v1/mcp.php"
