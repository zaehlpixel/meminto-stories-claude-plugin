interface:
  display_name: "Check before printing"
  short_description: "Find print blockers and useful editorial improvements"
  default_prompt: "Use $check-print-readiness to check my connected book's technical blockers, warnings and optional improvements."

dependencies:
  tools:
    - type: "mcp"
      value: "meminto-stories"
      description: "Read and edit the connected user's Meminto books"
      transport: "streamable_http"
      url: "https://app.meminto.com/mcp/v1/mcp.php"
