interface:
  display_name: "Import a manuscript"
  short_description: "Preview a file, images and links before adding them to a book"
  default_prompt: "Use $import-book to bring my existing manuscript into Meminto and show me the complete conversion before importing."

dependencies:
  tools:
    - type: "mcp"
      value: "meminto-stories"
      description: "Read and edit the connected user's Meminto books"
      transport: "streamable_http"
      url: "https://app.meminto.com/mcp/v1/mcp.php"
