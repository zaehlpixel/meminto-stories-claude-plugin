interface:
  display_name: "Review your manuscript"
  short_description: "Check continuity, structure and reader orientation"
  default_prompt: "Use $review-book to assess the central thread and continuity of my Meminto book without changing it."

dependencies:
  tools:
    - type: "mcp"
      value: "meminto-stories"
      description: "Read and edit the connected user's Meminto books"
      transport: "streamable_http"
      url: "https://app.meminto.com/mcp/v1/mcp.php"
